<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Importar facturas</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; color: #222; }
  .dropzone {
    border: 2px dashed #888;
    border-radius: 8px;
    padding: 48px 24px;
    text-align: center;
    color: #666;
    cursor: pointer;
    transition: border-color .15s, background-color .15s;
  }
  .dropzone.dragover {
    border-color: #2563eb;
    background-color: #eff6ff;
    color: #2563eb;
  }
  #file-list { margin-top: 16px; list-style: none; padding: 0; }
  #file-list li {
    padding: 6px 10px;
    background: #f3f4f6;
    border-radius: 4px;
    margin-bottom: 4px;
    font-size: 14px;
  }
  select, button {
    margin-top: 16px;
    padding: 8px 12px;
    font-size: 15px;
  }
  .messages { padding: 0; margin-bottom: 16px; }
  .messages li { padding: 8px 12px; border-radius: 4px; margin-bottom: 6px; list-style: none; }
  .messages .success { background: #dcfce7; color: #166534; }
  .messages .error { background: #fee2e2; color: #991b1b; }
  .messages .warning { background: #fef9c3; color: #854d0e; }
</style>
</head>
<body>
  <h1>Importar facturas</h1>
  <p><a href="{% url 'invoice_data:index' %}">← Volver a Gestión de Facturas</a></p>

  {% if messages %}
  <ul class="messages">
    {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

  <form method="post" enctype="multipart/form-data" id="upload-form">
    {% csrf_token %}

    <label>Tipo</label>
    {{ form.tipo_entidad }}

    <div id="departamento-field">
      <label for="id_departamento">Departamento</label>
      {{ form.departamento }}
    </div>

    <div id="dropzone" class="dropzone">
      Arrastra aquí tus facturas (PDF o fotos), o haz clic para seleccionarlas
    </div>
    <input type="file" id="file-input" name="files" multiple
           accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.bmp,.webp" style="display: none;">

    <ul id="file-list"></ul>

    <button type="submit">Importar</button>
  </form>

<script>
  function toggleDepartamentoField() {
    const acreedorSelected = document.querySelector('input[name="tipo_entidad"][value="acreedor"]')?.checked;
    document.getElementById("departamento-field").style.display = acreedorSelected ? "none" : "block";
  }
  document.querySelectorAll('input[name="tipo_entidad"]').forEach((el) => {
    el.addEventListener("change", toggleDepartamentoField);
  });
  toggleDepartamentoField();
  const dropzone = document.getElementById("dropzone");
  const fileInput = document.getElementById("file-input");
  const fileList = document.getElementById("file-list");

  function renderFileList(files) {
    fileList.innerHTML = "";
    Array.from(files).forEach((f) => {
      const li = document.createElement("li");
      li.textContent = `${f.name} (${(f.size / 1024).toFixed(0)} KB)`;
      fileList.appendChild(li);
    });
  }

  dropzone.addEventListener("click", () => fileInput.click());

  dropzone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropzone.classList.add("dragover");
  });

  dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("dragover");
  });

  dropzone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    fileInput.files = e.dataTransfer.files;
    renderFileList(fileInput.files);
  });

  fileInput.addEventListener("change", () => {
    renderFileList(fileInput.files);
  });
</script>
</body>
</html>
