<!-- nominas/mes.html (añadir al final, dentro de tab_content) -->
{{ chart_labels|json_script:"chart-labels" }}
{{ chart_data|json_script:"chart-data" }}
<canvas id="graficoDepartamento"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const labels = JSON.parse(document.getElementById('chart-labels').textContent);
  const data = JSON.parse(document.getElementById('chart-data').textContent);
  new Chart(document.getElementById('graficoDepartamento'), {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: 'Coste total (nómina + extra)', data: data }] },
  });
</script>
