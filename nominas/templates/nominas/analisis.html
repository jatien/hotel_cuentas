<a href="{% url 'nominas' %}" class="btn-volver">← Volver a nóminas</a>
<h2>Análisis {{ anio }}</h2>

<form method="get" class="form-analisis">
  <label for="mes">Periodo:</label>
  <select name="mes" id="mes" onchange="this.form.submit()">
    <option value="todos" {% if mes_seleccionado == 'todos' %}selected{% endif %}>Todo el año</option>
    {% for m, nombre in meses_opciones %}
      <option value="{{ m }}" {% if mes_seleccionado == m|stringformat:"s" %}selected{% endif %}>{{ nombre }}</option>
    {% endfor %}
  </select>

  <label for="parametro">Parámetro:</label>
  <select name="parametro" id="parametro" onchange="this.form.submit()">
    <option value="departamento" {% if parametro_seleccionado == 'departamento' %}selected{% endif %}>Departamento</option>
    <option value="total_impositivo" {% if parametro_seleccionado == 'total_impositivo' %}selected{% endif %}>Total impositivo</option>
  </select>
</form>

<div style="max-width: 600px; margin-top: 24px;">
  <canvas id="grafico"></canvas>
</div>

{{ chart_labels|json_script:"chart-labels" }}
{{ chart_data|json_script:"chart-data" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const labels = JSON.parse(document.getElementById('chart-labels').textContent);
  const data = JSON.parse(document.getElementById('chart-data').textContent);
  const tipo = "{{ chart_type }}";

  new Chart(document.getElementById('grafico'), {
    type: tipo,
    data: {
      labels: labels,
      datasets: [{
        label: "{{ parametro_seleccionado }}",
        data: data,
        backgroundColor: tipo === 'doughnut'
          ? ['#2563eb', '#16a34a', '#dc2626', '#f59e0b', '#7c3aed', '#0891b2', '#db2777', '#65a30d']
          : ['#16a34a', '#dc2626'],
      }],
    },
    options: { responsive: true },
  });
</script>

<style>
  .form-analisis { display: flex; gap: 16px; align-items: center; margin-top: 16px; }
  .form-analisis select { padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; }
</style>
