{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cuentas{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #E9EDF2;
      --tarjeta: #FFFFFF;
      --acento: #2D4FC4;
      --acento-tinte: #EEF2FC;
      --tinta: #1C2733;
      --tinta-suave: #5B6878;
      --aviso: #9B3D5B;
    }
    body {
      margin: 0;
      padding: 2rem;
      font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
      background: var(--fondo);
      color: var(--tinta);
    }
    a { color: var(--acento); }
    h1, h2 { font-weight: 600; letter-spacing: -.01em; }

    header.top {
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: 1.5rem; font-size: .95rem;
    }
    header.top a { text-decoration: none; font-weight: 600; }

    table {
      border-collapse: collapse; width: 100%; background: var(--tarjeta);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 2px rgb(28 39 51 / .06), 0 10px 28px -14px rgb(28 39 51 / .28);
    }
    th, td { padding: .5rem .75rem; text-align: left; border-bottom: 1px solid var(--fondo); }
    th { background: var(--acento-tinte); color: var(--acento); }
  </style>
  {% block extra_head %}{% endblock %}
  <script src="{% static 'seguridad/acciones.js' %}" defer></script>
</head>
<body>
  <header class="top">
    <a href="{% url 'home' %}">← Cuentas</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
