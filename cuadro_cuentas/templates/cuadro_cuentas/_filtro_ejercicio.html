<label>Ejercicio
  <select name="ejercicio" data-autosubmit>
    {% for e in ejercicios %}<option value="{{ e.anio }}" {% if e == ejercicio %}selected{% endif %}>{{ e.anio }}{% if e.cerrado %} (cerrado){% endif %}</option>
    {% empty %}<option value="">Sin ejercicios</option>{% endfor %}
  </select>
</label>
