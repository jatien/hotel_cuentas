{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block titulo %}Contabilidad{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'cuadro_cuentas/tema.css' %}">
  <link rel="stylesheet" href="{% static 'cuadro_cuentas/libro.css' %}">
  <link rel="stylesheet" href="{% static 'cuadro_cuentas/consultas.css' %}">
  {% block head %}{% endblock %}
  <script src="{% static 'seguridad/acciones.js' %}" defer></script>
</head>
<body>
  {% include "cuadro_cuentas/_nav.html" %}
  {% block cuerpo %}{% endblock %}
  <script nonce="{{ csp_nonce }}">window.CONTA = { preferenciasUrl: "{% url 'cuadro_cuentas:api_preferencias' 'TABLA' %}", punteoUrl: "{% url 'cuadro_cuentas:api_punteo' %}" };</script>
  <script src="{% static 'cuadro_cuentas/tablas.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
